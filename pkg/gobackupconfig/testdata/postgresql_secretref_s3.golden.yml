models:
  app-backup:
    databases:
      app-pg:
        database: appdb
        host: pg.svc
        password: SECRET(db-creds/password)
        port: 5432
        type: postgresql
        username: SECRET(db-creds/username)
    storages:
      app-s3:
        access_key_id: SECRET(s3-creds/access-key-id)
        bucket: my-bucket
        keep: 30
        path: backups/app
        region: us-east-1
        secret_access_key: SECRET(s3-creds/secret-access-key)
        storage_class: STANDARD_IA
        timeout: 600
        type: s3
