version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    rules:
      # Generated deepcopy and CRD scaffolding.
      - path: zz_generated\..*\.go
        linters:
          - errcheck
          - staticcheck
          - unused

formatters:
  enable:
    - gofmt
    - goimports
