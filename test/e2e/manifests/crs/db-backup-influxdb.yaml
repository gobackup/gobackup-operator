apiVersion: gobackup.io/v1alpha1
kind: Database
metadata:
  name: influxdb
  namespace: gobackup-e2e-test
spec:
  type: influxdb
  config:
    influxdb:
      host: http://influxdb.gobackup-e2e-test:8086
      token: my-super-secret-auth-token
      org: my-org
      bucket: my-bucket
---
apiVersion: gobackup.io/v1alpha1
kind: Backup
metadata:
  name: backup-influxdb
  namespace: gobackup-e2e-test
spec:
  schedule:
    cron: '*/5 * * * *'
  databaseRefs:
  - name: influxdb
  storageRefs:
  - name: minio
  compressWith:
    type: gzip
