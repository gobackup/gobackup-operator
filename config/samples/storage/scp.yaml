apiVersion: gobackup.io/v1alpha1
kind: Storage
metadata:
  name: scp-storage
  namespace: default
spec:
  type: scp
  config:
    scp:
      host: server.example.com
      port: 22
      username: scpuser
      private_key_ref:
        name: storage-credentials
        key: ssh-private-key
      passphrase_ref:
        name: storage-credentials
        key: ssh-passphrase
      path: /data/backups
      keep: 15
      timeout: 300
