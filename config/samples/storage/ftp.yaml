apiVersion: gobackup.io/v1alpha1
kind: Storage
metadata:
  name: ftp-storage
  namespace: default
spec:
  type: ftp
  config:
    ftp:
      host: ftp.example.com
      port: 21
      username: ftpuser
      password_ref:
        name: storage-credentials
        key: ftp-password
      path: /backups
      keep: 20
      timeout: 300
