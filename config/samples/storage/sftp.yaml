apiVersion: gobackup.io/v1alpha1
kind: Storage
metadata:
  name: sftp-storage
  namespace: default
spec:
  type: sftp
  config:
    sftp:
      host: sftp.example.com
      port: 22
      username: sftpuser
      password_ref:
        name: storage-credentials
        key: sftp-password
      path: /backups
      keep: 20
      timeout: 300
