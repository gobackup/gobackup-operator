apiVersion: gobackup.io/v1alpha1
kind: Database
metadata:
  name: example-mongodb-direct
  namespace: default
spec:
  type: mongodb
  config:
    mongodb:
      host: mongodb.example.svc.cluster.local
      port: 27017
      database: exampledb
      username: root
      password: examplepassword
      authdb: admin
      oplog: true
