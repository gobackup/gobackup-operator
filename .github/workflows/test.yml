name: Build & Test
on:
  pull_request:
  push:
    branches:
      - "*"
    tags:
      - "*"
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    env:
      GO_ENV: test
    steps:
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5.3.1
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
        id: go
      - name: Download dependencies
        run: go mod download
      # `make test` installs the pinned controller-gen + setup-envtest into
      # bin/, downloads the envtest assets (Kubernetes ENVTEST_K8S_VERSION),
      # exports KUBEBUILDER_ASSETS, and runs both the unit and the controller
      # envtest integration suite.
      - name: Test
        run: make test
